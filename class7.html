        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
        :root { --scale: 1; --app-h: 100dvh; --cyan: #00eaff; --bg: #03050b; --card: #0b101c; --card2: #111a2b; --border: rgba(255,255,255,0.08); --text: #e6f0ff; --muted: #7a8aa8; }
        * { box-sizing: border-box; }
        html { font-size: calc(16px * var(--scale)); margin:0; padding:0; overflow:hidden; }
        body { margin:0; background: var(--bg); color: var(--text); overflow:hidden; font-family: "Space Grotesk", system-ui, sans-serif; }
        .app { height: var(--app-h); display:flex; flex-direction:column; overflow:hidden; position:relative; background: var(--bg); padding-top: var(--safe-area-inset-top); }
        .app::before { content:""; position:absolute; inset:0; pointer-events:none; background: radial-gradient(120% 70% at 20% 0%, rgba(0,234,255,0.14), transparent 60%), radial-gradient(90% 60% at 90% 10%, rgba(120,90,255,0.12), transparent 55%), radial-gradient(80% 50% at 50% 100%, rgba(0,234,255,0.07), transparent 50%); z-index:0; }
        .header { position: sticky; top: var(--safe-area-inset-top); z-index:5; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); backdrop-filter: blur(18px); background: rgba(3,5,11,0.72); }
        .logo { display:flex; gap:0.75rem; align-items:center; }
        .logo-mark { width:2rem; height:2rem; border-radius:0.5rem; background: linear-gradient(135deg, #00eaff, #7a5cff); display:grid; place-items:center; font-family:"Geist Mono"; font-weight:700; color:#001014; font-size:0.9rem; }
        .logo-text { line-height:1; }
        .logo-title { font-weight:700; letter-spacing:-0.02em; font-size:1rem; }
        .logo-sub { font-size:0.68rem; color: var(--muted); margin-top:0.15rem; letter-spacing:0.02em; }
        .badge-mode { display:inline-flex; align-items:center; gap:0.35rem; border:1px solid rgba(0,234,255,0.35); background: rgba(0,234,255,0.12); color: var(--cyan); padding:0.25rem 0.6rem; border-radius:999px; font-family:"Geist Mono"; font-size:0.72rem; font-weight:600; letter-spacing:0.04em; }
        .font-ctrls { display:flex; gap:0.25rem; }
        .font-btn { width:1.85rem; height:1.85rem; border-radius:999px; border:1px solid var(--border); background: var(--card); color: var(--muted); font-family:"Geist Mono"; font-size:0.7rem; cursor:pointer; display:grid; place-items:center; transition: all 0.2s; }
        .font-btn.active { background: var(--cyan); color:#001018; border-color: var(--cyan); box-shadow: 0 0 18px rgba(0,234,255,0.5); }

        .main { flex:1; overflow:hidden; display:flex; flex-direction:column; position:relative; z-index:1; min-height:0; }

        /* INTRO */
        .intro { flex:1; display:flex; flex-direction:column; overflow:hidden; padding: 0.9rem 1rem 0.75rem; gap:0.85rem; }
        .lang-card { background: linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--border); border-radius:1rem; padding:0.9rem; box-shadow: 0 10px 40px rgba(0,0,0,0.4); flex-shrink:0; }
        .lang-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem; }
        .lang-title { font-weight:600; font-size:0.95rem; letter-spacing:-0.01em; }
        .lang-subtitle { font-size:0.72rem; color: var(--muted); margin-top:0.15rem; }
        .lang-pills { display:flex; gap:0.5rem; flex-wrap:wrap; }
        .pill { padding:0.48rem 0.9rem; border-radius:999px; border:1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--muted); font-family:"Geist Mono"; font-size:0.78rem; font-weight:600; cursor:pointer; transition: all 0.22s; letter-spacing:0.02em; }
        .pill.active { background: var(--cyan); color:#001018; border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,234,255,0.45), 0 2px 10px rgba(0,234,255,0.3); transform: translateY(-1px); }
        .progress-row { display:flex; align-items:center; gap:0.75rem; }
        .progress-track { flex:1; height:0.4rem; background: rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; }
        .progress-fill { height:100%; background: linear-gradient(90deg, var(--cyan), #7a5cff); transition: width 0.5s ease; }
        .progress-txt { font-family:"Geist Mono"; font-size:0.7rem; color: var(--muted); }

        .modules { flex:1; overflow:hidden; display:flex; flex-direction:column; gap:0.65rem; min-height:0; }
        .modules-head { font-size:0.78rem; font-weight:600; color: var(--muted); letter-spacing:0.06em; text-transform:uppercase; }
        .module-grid { display:flex; flex-direction:column; gap:0.6rem; overflow:hidden; }
        .module-card { display:flex; align-items:center; gap:0.9rem; padding:0.8rem 0.9rem; background: var(--card); border:1px solid var(--border); border-radius:0.9rem; cursor:pointer; transition: all 0.2s; }
        .module-card:hover { border-color: rgba(0,234,255,0.3); transform: translateY(-1px); }
        .module-icon { width:2.2rem; height:2.2rem; border-radius:0.6rem; background: rgba(0,234,255,0.1); border:1px solid rgba(0,234,255,0.18); display:grid; place-items:center; color: var(--cyan); font-size:1rem; flex-shrink:0; }
        .module-info { flex:1; min-width:0; }
        .module-title { font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .module-meta { font-size:0.7rem; color: var(--muted); font-family:"Geist Mono"; margin-top:0.15rem; display:flex; gap:0.5rem; }
        .module-arrow { color: var(--muted); }

        /* GAME */
        .game { flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
        .game-top { flex-shrink:0; padding:0.6rem 1rem; display:flex; align-items:center; justify-content:space-between; gap:0.6rem; border-bottom:1px solid var(--border); background: rgba(11,16,28,0.6); backdrop-filter: blur(12px); }
        .game-top-left { display:flex; align-items:center; gap:0.6rem; }
        .phase-badge { background: var(--card2); border:1px solid var(--border); padding:0.25rem 0.6rem; border-radius:999px; font-family:"Geist Mono"; font-size:0.68rem; font-weight:600; letter-spacing:0.05em; color: var(--text); }
        .phase-badge.final { background: rgba(0,234,255,0.14); border-color: rgba(0,234,255,0.3); color: var(--cyan); }
        .hud { display:flex; gap:0.9rem; font-family:"Geist Mono"; font-size:0.7rem; }
        .hud b { color: var(--text); font-weight:600; }
        .hud span { color: var(--muted); }

        .game-center { flex:1; display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap: clamp(0.4rem, 1.5vh, 0.9rem); padding: clamp(0.6rem, 2vh, 1.1rem) 1rem; min-height:0; overflow:hidden; }
        .kb-open .game-center { gap: 0.35rem; padding-top:0.5rem; padding-bottom:0.35rem; }
        .prompt-wrap { text-align:center; }
        .prompt-label { font-family:"Geist Mono"; font-size:0.7rem; color: var(--muted); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:0.35rem; }
        .prompt-text { font-size: clamp(1.15rem, 4.2vw, 1.55rem); font-weight:700; line-height:1.15; letter-spacing:-0.02em; }
        .prompt-text .hl { color: var(--cyan); }
        .prompt-es { color: var(--text); }
        .help-text { font-size:0.72rem; color: var(--muted); text-align:center; min-height:1rem; transition: opacity 0.2s; }
        .kb-open .help-text { opacity:0; height:0; min-height:0; overflow:hidden; }

        .input-wrap { display:flex; justify-content:center; }
        .game-input { width:min(22rem, 100%); background: var(--card); border:1.5px solid var(--border); border-radius:0.9rem; padding:0.85rem 1rem; font-size:1.05rem; color: var(--text); font-weight:500; text-align:center; outline:none; transition: all 0.2s; font-family:"Space Grotesk"; }
        .game-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,234,255,0.18); }
        .game-input.correct { border-color:#22c55e; background: rgba(34,197,94,0.1); }
        .game-input.wrong { border-color:#fb7185; background: rgba(251,113,133,0.1); }

        .options { display:flex; flex-direction:column; gap:0.5rem; width:min(22rem, 100%); margin:0 auto; }
        .opt { display:flex; align-items:center; gap:0.75rem; padding:0.7rem 0.85rem; border-radius:0.8rem; background: var(--card); border:1px solid var(--border); cursor:pointer; transition: all 0.18s; text-align:left; }
        .opt:hover { border-color: rgba(0,234,255,0.35); }
        .opt.selected { border-color: var(--cyan); background: rgba(0,234,255,0.12); }
        .opt.correct { border-color:#22c55e; background: rgba(34,197,94,0.14); }
        .opt.wrong { border-color:#fb7185; background: rgba(251,113,133,0.12); }
        .opt-letter { width:1.6rem; height:1.6rem; border-radius:999px; background: rgba(255,255,255,0.08); border:1px solid var(--border); display:grid; place-items:center; font-family:"Geist Mono"; font-size:0.7rem; font-weight:700; flex-shrink:0; }
        .opt.selected .opt-letter { background: var(--cyan); color:#001018; border-color: var(--cyan); }
        .opt-text { font-size:0.92rem; font-weight:500; }

        .feedback { min-height:2.1rem; display:flex; align-items:center; justify-content:center; text-align:center; font-size:0.82rem; font-weight:500; transition: all 0.2s; }
        .feedback.correct { color:#22c55e; }
        .feedback.wrong { color:#fb7185; }

        .game-bottom { flex-shrink:0; z-index:10; height:3.25rem; min-height:3.25rem; padding:0.45rem 1rem calc(0.45rem + env(safe-area-inset-bottom,0px)); background: linear-gradient(180deg, rgba(3,5,11,0.0), rgba(3,5,11,0.9) 25%, var(--bg) 60%); border-top:1px solid var(--border); display:flex; align-items:center; gap:0.75rem; backdrop-filter: blur(10px); }
        .btn-primary { flex:1; height:2.35rem; border-radius:999px; background: var(--cyan); color:#001018; border:none; font-weight:700; font-size:0.92rem; letter-spacing:0.01em; cursor:pointer; box-shadow: 0 6px 22px rgba(0,234,255,0.35); transition: transform 0.15s; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-ghost { height:2.35rem; padding:0 1rem; border-radius:999px; background: var(--card); border:1px solid var(--border); color: var(--text); font-weight:600; font-size:0.85rem; cursor:pointer; }

        @media (min-width: 700px) {
          .intro { max-width: 44rem; margin:0 auto; width:100%; }
          .game-center { max-width: 38rem; margin:0 auto; width:100%; }
