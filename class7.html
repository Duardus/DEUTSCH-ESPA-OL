<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<title>PolyGlot Matrix — Infinite Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#03050b; --surface:#0d1320; --surface2:#0b101c; --surface3:#111a2d;
  --text:#f8fafc; --muted:#94a3b8; --muted2:#64748b;
  --accent:#00eaff; --accent2:#0077ff; --success:#00ff88; --error:#ff426d;
  --border:rgba(255,255,255,.11); --border2:rgba(255,255,255,.18);
  --radius:14px; --radius-sm:10px;
  --scale:1; --gap:10px; --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:16px}
body{
  min-height:100%; height:100dvh; overflow:hidden;
  background:
    radial-gradient(800px 400px at 50% -10%, rgba(0,234,255,.14), transparent 60%),
    radial-gradient(600px 300px at 90% 20%, rgba(0,119,255,.12), transparent 60%),
    var(--bg);
  color:var(--text); font-family:Inter,system-ui,sans-serif;
  display:flex; justify-content:center; align-items:stretch;
}
button,input,select{font:inherit}
button{cursor:pointer; touch-action:manipulation; user-select:none}
button:disabled{opacity:.5; cursor:not-allowed}
.app{
  width:100%; max-width:480px; height:100%; max-height:100dvh;
  display:flex; flex-direction:column; gap:10px;
  padding:10px; padding-bottom:calc(10px + var(--safe-bottom));
  background:linear-gradient(180deg, rgba(17,26,45,.96), rgba(13,19,32,.98));
  border:1px solid var(--border); border-radius:0; box-shadow:var(--shadow);
  overflow:hidden;
}
@media(min-width:520px){ .app{ border-radius:18px; margin:12px auto; max-height:860px; height:calc(100dvh - 24px);} }

.global-progress{
  flex-shrink:0; background:var(--surface2); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px; position:relative; overflow:hidden;
}
.global-progress::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(0,234,255,.06), transparent);
  animation:shimmer 3.5s infinite; pointer-events:none;
}
.global-info{display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:calc(.72rem * var(--scale)); font-weight:700; letter-spacing:.04em}
.global-info b{color:var(--accent)}
.progress-track{width:100%; height:6px; background:#1a2333; border-radius:99px; overflow:hidden; margin-top:7px}
.progress-fill{width:0%; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .35s cubic-bezier(.2,.8,.2,1)}

.screen{display:none; flex:1; min-height:0; flex-direction:column; gap:var(--gap)}
.screen.active{display:flex}
.scroll-area{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; display:flex; flex-direction:column; gap:var(--gap); padding-bottom:6px}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:#233047; border-radius:99px}

h1,h2{font-family:Rajdhani,sans-serif; text-transform:uppercase; letter-spacing:.06em}
.intro-header{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.intro-header h1{color:var(--accent); font-size:calc(1.65rem * var(--scale)); line-height:.95}
.intro-header p{color:var(--muted); font-size:calc(.74rem * var(--scale)); line-height:1.4; margin-top:4px}
.btn-index,.secondary,.a11y{background:var(--surface2); color:var(--muted); border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-size:calc(.78rem * var(--scale)); font-weight:700; flex-shrink:0; transition:.18s}
.btn-index{color:var(--accent); text-decoration:none; display:inline-flex; align-items:center}
.a11y.active{color:#001018; background:var(--accent); border-color:var(--accent); box-shadow:0 0 18px rgba(0,234,255,.35)}
.secondary:hover,.a11y:hover{border-color:var(--border2); transform:translateY(-1px)}

.card{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0}
.card.col{flex-direction:column; align-items:stretch}
.controls{display:flex; gap:6px}
select{max-width:62%; padding:8px 10px; border-radius:8px; background:#0e1526; color:white; border:1px solid var(--border); font-size:calc(.82rem * var(--scale)); outline:none}
select:focus{border-color:var(--accent)}
.lang-row{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%}
.lang-row label{color:var(--muted); font-weight:600; font-size:calc(.8rem * var(--scale))}

.section-title{color:var(--accent); font-size:calc(.88rem * var(--scale)); text-align:center; letter-spacing:.12em; margin-top:2px}

.modules-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.module-card{
  min-width:0; padding:13px 12px; text-align:left; border:1px solid var(--border); border-radius:14px;
  background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)), var(--surface2);
  color:white; display:flex; flex-direction:column; gap:6px; transition:.2s cubic-bezier(.2,.8,.2,1);
  position:relative; overflow:hidden; isolation:isolate;
}
.module-card::before{content:""; position:absolute; inset:0; background:radial-gradient(300px 120px at 0% 0%, rgba(0,234,255,.12), transparent 60%); opacity:0; transition:.2s; z-index:-1}
.module-card:hover{border-color:var(--border2); transform:translateY(-2px)}
.module-card:hover::before{opacity:1}
.module-card:active{transform:scale(.97)}
.mod-num{color:var(--accent); font-size:calc(.7rem * var(--scale)); font-weight:700; letter-spacing:.08em}
.mod-title{font-size:calc(.92rem * var(--scale)); font-weight:700; line-height:1.2}
.mod-prog,.mod-record{color:var(--muted); font-size:calc(.70rem * var(--scale)); line-height:1.3}
.mod-record{color:var(--success)}

.game-header{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; border-bottom:1px solid var(--border); padding-bottom:10px}
.game-header h2{font-size:calc(.92rem * var(--scale)); color:var(--accent); text-align:center; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.hud{display:flex; justify-content:space-between; color:var(--muted); font-size:calc(.76rem * var(--scale)); font-weight:700; flex-shrink:0; letter-spacing:.02em}
.help{padding:10px 11px; background:linear-gradient(180deg, rgba(0,234,255,.06), rgba(0,234,255,.02)); border:1px dashed rgba(0,234,255,.26); border-radius:10px; color:#cbd5e1; font-size:calc(.78rem * var(--scale)); line-height:1.45; flex-shrink:0}

.prompt{background:linear-gradient(180deg, var(--surface3), var(--surface2)); padding:14px; border-radius:14px; border:1px solid var(--border); border-left:3px solid var(--accent); display:flex; flex-direction:column; gap:10px; flex-shrink:0; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.prompt-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.prompt-tag{color:var(--muted); font-size:calc(.7rem * var(--scale)); text-transform:uppercase; letter-spacing:.08em; font-weight:700}
.badge{font-size:calc(.68rem * var(--scale)); font-weight:700; padding:5px 8px; border-radius:999px; background:rgba(0,234,255,.12); color:var(--accent); white-space:nowrap; border:1px solid rgba(0,234,255,.22)}
.badge.write{color:var(--error); background:rgba(255,66,109,.12); border-color:rgba(255,66,109,.22)}
.target{font-size:calc(1.22rem * var(--scale)); font-weight:700; line-height:1.35; overflow-wrap:anywhere; letter-spacing:-.01em}

.anki-options{display:flex; flex-direction:column; gap:9px}
.option{
  padding:13px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface2); color:white; font-size:calc(1rem * var(--scale)); font-weight:600;
  text-align:left; line-height:1.35; overflow-wrap:anywhere; transition:.18s;
}
.option:hover{border-color:var(--border2); background:#101a2e}
.option:active{transform:scale(.98); border-color:var(--accent)}
.option.correct{border-color:var(--success); background:rgba(0,255,136,.1)}
.option.wrong{border-color:var(--error); background:rgba(255,66,109,.1)}

.typing{display:flex; flex-direction:column; gap:10px}
.user-input{
  width:100%; min-width:0; padding:14px 12px; border:2px solid var(--border); border-radius:12px;
  background:#060912; color:white; font-size:max(16px, calc(1rem * var(--scale))); text-align:center; outline:none; transition:.18s;
}
.user-input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(0,234,255,.15)}

.main-btn{
  width:100%; padding:13px; border:0; border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#001018; font-family:Rajdhani,sans-serif; font-size:calc(1.06rem * var(--scale)); font-weight:700; letter-spacing:.04em;
  box-shadow:0 10px 24px rgba(0,234,255,.25); transition:.18s;
}
.main-btn:hover{transform:translateY(-1px); box-shadow:0 14px 30px rgba(0,234,255,.3)}
.main-btn:active{transform:scale(.98)}
.main-btn.error-btn{background:linear-gradient(135deg,#ff5a84,#ff2e6a); color:white; box-shadow:0 10px 24px rgba(255,66,109,.3)}
.main-btn.success-btn{background:linear-gradient(135deg,#2eff9e,#00c86a); color:#001b10; box-shadow:0 10px 24px rgba(0,255,136,.28)}

.feedback{display:none; padding:11px 12px; border-radius:12px; font-size:calc(.86rem * var(--scale)); text-align:center; line-height:1.45; flex-shrink:0; border:1px solid transparent}
.feedback.success{display:block; color:var(--success); background:rgba(0,255,136,.08); border-color:rgba(0,255,136,.22)}
.feedback.error{display:block; color:#ffd1dc; background:rgba(255,66,109,.1); border-color:rgba(255,66,109,.24)}
.answer{display:block; color:white; font-size:calc(1.06rem * var(--scale)); font-weight:700; margin:6px 0}

.game-bottom{flex-shrink:0; display:flex; flex-direction:column; gap:8px}
.hidden{display:none !important}

@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes pop{0%{transform:scale(.9); opacity:0}100%{transform:scale(1); opacity:1}}
.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1)}

@media(max-height:700px){ .app{gap:7px; padding:7px} .prompt{padding:11px} .option{padding:11px 12px} }
@media(max-width:360px){ .modules-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <div class="global-progress">
    <div class="global-info"><span>PROGRESO GENERAL: <b id="global-pct">0%</b></span><span id="global-languages">EN · DE</span></div>
    <div class="progress-track"><div id="global-fill" class="progress-fill"></div></div>
  </div>

  <section id="screen-intro" class="screen active">
    <div class="scroll-area">
      <header class="intro-header">
        <div><h1>PolyGlot<br>Matrix</h1><p>Memorización inteligente · 3 aciertos consecutivos para dominar.</p></div>
        <a href="index.html" class="btn-index">⌂ Índice</a>
      </header>

      <div class="card"><span>🔍 Tamaño</span><div class="controls">
        <button class="a11y active" data-size="1">A</button><button class="a11y" data-size="1.15">A+</button><button class="a11y" data-size="1.3">A++</button>
      </div></div>

      <div class="card col">
        <div class="lang-row"><label for="sel-q">Preguntar en:</label><select id="sel-q"><option value="en">Inglés (EN)</option><option value="de">Alemán (DE)</option><option value="es">Español (ES)</option></select></div>
        <div class="lang-row"><label for="sel-a">Responder en:</label><select id="sel-a"><option value="de">Alemán (DE)</option><option value="en">Inglés (EN)</option><option value="es">Español (ES)</option></select><button id="swap-langs" class="secondary" title="Intercambiar">⇄</button></div>
      </div>

      <h2 class="section-title">MÓDULOS DE APRENDIZAJE</h2>
      <div id="modules-grid" class="modules-grid"></div>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <header class="game-header">
      <button class="secondary" id="menu-btn">← Menú</button>
      <h2 id="game-title">Módulo</h2>
      <div class="controls"><button class="a11y" data-size="1">A</button><button class="a11y" data-size="1.15">A+</button><button class="a11y" data-size="1.3">A++</button></div>
    </header>

    <div class="hud"><span id="hud-progress">Dominadas: 0/0</span><span id="hud-streak">Racha: 0/3</span></div>

    <div class="scroll-area" id="game-scroll">
      <div class="help" id="human-help">Cada frase necesita tres aciertos consecutivos. Un error reinicia su racha.</div>
      <div class="prompt">
        <div class="prompt-top"><span class="prompt-tag" id="label-instruction">Traduce:</span><span class="badge" id="mode-badge">FASE 1/3</span></div>
        <div class="target" id="display-target">Cargando...</div>
      </div>
      <div id="anki-container" class="anki-options"></div>
      <div id="typing-container" class="typing hidden">
        <input id="user-input" class="user-input" type="text" placeholder="Escribe la traducción..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      </div>
      <div id="feedback-box" class="feedback" aria-live="polite"></div>
    </div>

    <div class="game-bottom"><button id="action-btn" class="main-btn hidden">Comprobar</button></div>
  </section>
</div>

<script>
"use strict";
const partsData=[
{id:1,title:"1. Necesidades Básicas",help:"Estructuras fundamentales: tener, poseer y expresar necesidades.",items:[
{en:"I have time.",de:"Ich habe Zeit.",es:"Tengo tiempo."},{en:"I have money.",de:"Ich habe Geld.",es:"Tengo dinero."},{en:"I have food.",de:"Ich habe Essen.",es:"Tengo comida."},{en:"I have water.",de:"Ich habe Wasser.",es:"Tengo agua."},{en:"I have friends.",de:"Ich habe Freunde.",es:"Tengo amigos."},{en:"I have a car.",de:"Ich habe ein Auto.",es:"Tengo un auto."},{en:"I have a house.",de:"Ich habe ein Haus.",es:"Tengo una casa."},{en:"I have a problem.",de:"Ich habe ein Problem.",es:"Tengo un problema."}]},
{id:2,title:"2. Mente y Emociones",help:"Conceptos abstractos, sentimientos y estados mentales.",items:[
{en:"I have an idea.",de:"Ich habe eine Idee.",es:"Tengo una idea."},{en:"I have a question.",de:"Ich habe eine Frage.",es:"Tengo una pregunta."},{en:"I have energy.",de:"Ich habe Energie.",es:"Tengo energía."},{en:"I have luck.",de:"Ich habe Glück.",es:"Tengo suerte."},{en:"I have courage.",de:"Ich habe Mut.",es:"Tengo valor."},{en:"I have faith.",de:"Ich habe Vertrauen.",es:"Tengo fe."},{en:"I have hope.",de:"Ich habe Hoffnung.",es:"Tengo esperanza."}]},
{id:3,title:"3. Fortaleza y Propósito",help:"Estados internos, decisiones y expresiones de propósito.",items:[
{en:"I have strength.",de:"Ich habe Kraft.",es:"Tengo fuerza."},{en:"I have patience.",de:"Ich habe Geduld.",es:"Tengo paciencia."},{en:"I have time today.",de:"Ich habe heute Zeit.",es:"Tengo tiempo hoy."},{en:"I have a reason.",de:"Ich habe einen Grund.",es:"Tengo una razón."},{en:"I have a chance.",de:"Ich habe eine Chance.",es:"Tengo una oportunidad."},{en:"I have a dream.",de:"Ich habe einen Traum.",es:"Tengo un sueño."},{en:"I have everything.",de:"Ich habe alles.",es:"Tengo todo."}]}
];

const STORAGE={config:"polyglot_matrix_config_v2",progress:"polyglot_matrix_progress_v2",records:"polyglot_matrix_records_v2",font:"polyglot_matrix_fontsize_v2"};

const $=id=>document.getElementById(id);
const safeRead=(k,fb)=>{try{const v=localStorage.getItem(k); return v==null?fb:JSON.parse(v)}catch{return fb}};
const safeWrite=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v)); return true}catch(e){console.warn("Storage fail",e); return false}};
const shuffle=a=>{const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]} return r};
const normalize=s=>String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,\/#!$%\^&\*;:{}=\-_`~()«»"'?¿!¡()]/g,"").replace(/\s+/g," ").trim();
const haptic=t=>{try{navigator.vibrate&&navigator.vibrate(t)}catch{}};

const App={
  langQ:"en", langA:"de", font:1,
  progress:{}, records:{},
  rt:{partIdx:0, pool:[], active:[], streaks:{}, cur:null, last:null, completed:0, errors:0, start:0, token:0, state:"IDLE", timers:[]},
  clearTimers(){ this.rt.timers.forEach(clearTimeout); this.rt.timers=[]; },
  setState(s){ this.rt.state=s; },
  keyProgress(i){ return `p_${i}_${this.langQ}_${this.langA}`; },
  keyRecord(i){ return `rec_${i}_${this.langQ}_${this.langA}`; },
  getCompleted(i){ const v=this.progress[this.keyProgress(i)]; return Array.isArray(v)?v:[]; },

  init(){
    const cfg=safeRead(STORAGE.config,{});
    this.langQ=["en","de","es"].includes(cfg.q)?cfg.q:"en";
    this.langA=["en","de","es"].includes(cfg.a)?cfg.a:"de";
    if(this.langQ===this.langA) this.langA=["en","de","es"].find(x=>x!==this.langQ);
    this.progress=safeRead(STORAGE.progress,{});
    this.records=safeRead(STORAGE.records,{});
    const sf=Number(localStorage.getItem(STORAGE.font));
    if([1,1.15,1.3].includes(sf)) this.font=sf;
    $("sel-q").value=this.langQ; $("sel-a").value=this.langA;
    this.applyFont(); this.renderModules(); this.updateGlobal(); this.updateBadge();
    this.bindEvents();
  },
  applyFont(){
    document.documentElement.style.setProperty("--scale",String(this.font));
    document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("active", Math.abs(Number(b.dataset.size)-this.font)<0.001));
  },
  updateBadge(){ $("global-languages").textContent=`${this.langQ.toUpperCase()} · ${this.langA.toUpperCase()}`; },
  updateGlobal(){
    let tot=0, done=0;
    partsData.forEach((p,i)=>{ tot+=p.items.length; done+=this.getCompleted(i).length; });
    const pct=tot?Math.round(done/tot*100):0;
    $("global-pct").textContent=pct+"%"; $("global-fill").style.width=pct+"%";
  },
  renderModules(){
    const grid=$("modules-grid"); grid.replaceChildren();
    const frag=document.createDocumentFragment();
    partsData.forEach((part,idx)=>{
      const done=this.getCompleted(idx).length; const tot=part.items.length; const pct=tot?Math.round(done/tot*100):0;
      const rec=this.records[this.keyRecord(idx)];
      const card=document.createElement("button"); card.type="button"; card.className="module-card pop";
      card.style.animationDelay=`${idx*40}ms`;
      card.innerHTML=`<span class="mod-num">MÓDULO 0${idx+1} · ${pct}%</span><span class="mod-title">${part.title.replace(/^\d+\.\s*/,"")}</span><span class="mod-prog">Dominadas: ${done}/${tot}</span><span class="mod-record">${rec?`🏆 ${rec.time}s · ${rec.errors} errores`:`🏆 Sin récord`}</span>`;
      card.addEventListener("click",()=>this.startPart(idx));
      // reset con long-press
      let pressTimer=null;
      card.addEventListener("touchstart",()=>{ pressTimer=setTimeout(()=>{ if(confirm(`¿Borrar progreso de "${part.title}" en ${this.langQ.toUpperCase()}→${this.langA.toUpperCase()}?`)){ this.resetProgress(idx);} },650); },{passive:true});
      card.addEventListener("touchend",()=>clearTimeout(pressTimer));
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  },
  resetProgress(idx){
    delete this.progress[this.keyProgress(idx)];
    delete this.records[this.keyRecord(idx)];
    safeWrite(STORAGE.progress,this.progress); safeWrite(STORAGE.records,this.records);
    this.renderModules(); this.updateGlobal(); haptic(30);
  },
  saveConfig(){
    let q=$("sel-q").value, a=$("sel-a").value;
    if(q===a) a=["en","de","es"].find(x=>x!==q);
    $("sel-a").value=a; this.langQ=q; this.langA=a;
    safeW
