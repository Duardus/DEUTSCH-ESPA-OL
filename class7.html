  --tw-shadow-colored: 0 0 18px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-500{
  transition-duration: 500ms;
}

:root{
  --app-h: 100dvh;
  --scale: 1;
  --bg: #03050b;
  --card: #0b101c;
  --card-2: #10192b;
  --line: rgba(255,255,255,.12);
  --line-soft: rgba(255,255,255,.08);
  --cyan: #00eaff;
  --cyan-soft: rgba(0,234,255,.14);
  --text: #eef2ff;
  --muted: #8a94b0;
}

html,body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  margin:0;
  background: var(--bg);
  font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

html{
  font-size: calc(16px * var(--scale));
}

*{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

.shell{
  width:100%;
  height: var(--app-h, 100dvh);
  min-height: var(--app-h, 100dvh);
  background: radial-gradient(90% 60% at 10% 0%, rgba(0,234,255,.18), transparent 60%),
              radial-gradient(70% 50% at 100% 0%, rgba(88,101,255,.22), transparent 55%),
              #02040a;
  display:flex;
  justify-content:center;
  align-items:stretch;
  padding-top: var(--safe-area-inset-top);
  overflow:hidden;
}

.app{
  height: var(--app-h, 100dvh);
  width:100%;
  max-width:480px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  background: #03050b;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
  overflow:hidden;
  position:relative;
}

/* TOP BAR 56px */

.top-bar{
  flex-shrink:0;
  height:56px;
  min-height:56px;
  display:flex;
  align-items:center;
  gap: clamp(6px,1.2vh,10px);
  padding: 0 clamp(8px,1.5vw,12px);
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(0,234,255,.16), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.02), transparent),
    #03050b;
  border-bottom:1px solid var(--line-soft);
}

/* GAME META 48px */

.game-meta{
  flex-shrink:0;
  height:48px;
  min-height:48px;
  display:flex;
  align-items:center;
  gap: clamp(6px,1vh,8px);
  padding: 0 clamp(8px,1.2vh,12px);
  background: #050a14;
  border-bottom:1px solid var(--line-soft);
  overflow:hidden;
}

/* LANG PILLS 48px - hides when keyboard open */

.lang-pills{
  flex-shrink:0;
  height:48px;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:6px;
  padding: 0 clamp(8px,1.2vh,12px);
  background:#03050b;
  border-bottom:1px solid var(--line-soft);
  overflow:hidden;
  transition: all .18s ease;
}

body.kb-open .lang-pills{
  display:none !important;
  height:0 !important;
  min-height:0 !important;
  padding:0 !important;
  border:none !important;
}

/* GAME BODY */

.game-body{
  flex:1 1 0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap: clamp(6px,1vh,10px);
  overflow:hidden;
  padding: clamp(8px,1.2vh,12px);
  background:
    radial-gradient(80% 40% at 50% 0%, rgba(0,234,255,.08), transparent),
    #03050b;
}

.prompt-card{
  flex-shrink:0;
  min-height: clamp(56px, 10vh, 84px);
  max-height: clamp(72px, 14vh, 110px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
  padding: clamp(8px,1.4vh,12px) clamp(10px,2vw,14px);
  background: linear-gradient(180deg, var(--card) 0%, #0a1120 100%);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}

.options-area{
  flex:1 1 0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}

.option-btn{
  flex:1 1 0;
  min-height:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding: clamp(8px,1.2vh,12px) clamp(10px,1.6vw,14px);
  background: var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  text-align:left;
  font-size: clamp(0.82rem, 2.1vh, 0.96rem);
  line-height:1.25;
  transition: all .18s ease;
  overflow:hidden;
  cursor:pointer;
}

.option-btn:active{
  transform: scale(.97);
}

.option-btn.selected{
  border-color: var(--cyan);
  background: linear-gradient(180deg, rgba(0,234,255,.14), var(--card-2));
  box-shadow: 0 0 0 1px rgba(0,234,255,.2), 0 6px 18px rgba(0,234,255,.12);
}

.option-btn.correct{
  border-color:#22c55e;
  background: linear-gradient(180deg, rgba(34,197,94,.18), var(--card));
}

.option-btn.wrong{
  border-color:#ef4444;
  background: linear-gradient(180deg, rgba(239,68,68,.16), var(--card));
}

.letter-circle{
  flex-shrink:0;
  width: clamp(24px, 3.6vh, 30px);
  height: clamp(24px, 3.6vh, 30px);
  border-radius:999px;
  display:grid;
  place-items:center;
  background: #111a2e;
  border:1px solid var(--line);
  font-family:"JetBrains Mono", monospace;
  font-weight:700;
  font-size: clamp(0.68rem, 1.6vh, 0.82rem);
  color: var(--muted);
}

.write-input{
  flex-shrink:0;
  width:100%;
  min-height: clamp(48px, 7vh, 64px);
  padding: clamp(10px,1.6vh,14px) 14px;
  background: var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  color: var(--text);
  font-size: clamp(1rem, 2.8vh, 1.18rem);
  font-weight:600;
  text-align:center;
  outline:none;
  transition: all .18s ease;
}

.write-input:focus{
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(0,234,255,.18);
  background: var(--card-2);
}

.write-input::-moz-placeholder{
  color: #4a5678;
  font-weight:400;
}

.write-input::placeholder{
  color: #4a5678;
  font-weight:400;
}

.feedback{
  flex-shrink:0;
  max-height:22%;
  overflow:hidden;
  border-radius:12px;
  padding: clamp(6px,1vh,10px) clamp(10px,1.4vw,12px);
  font-size: clamp(0.78rem, 1.9vh, 0.9rem);
  line-height:1.3;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.game-bottom{
  flex-shrink:0;
  height: clamp(60px, 9vh, 72px);
  min-height: clamp(60px, 9vh, 72px);
  display:flex;
  gap:10px;
  padding:10px;
  background:#03050b;
  border-top:1px solid var(--line-soft);
  align-items:stretch;
}

.btn-skip{
  flex: 0 0 30%;
  height:100%;
  border-radius:12px;
  background:#0e1526;
  border:1px solid var(--line);
  color: var(--muted);
  font-weight:600;
  font-size: clamp(0.82rem, 2vh, 0.92rem);
  cursor:pointer;
  transition: all .18s ease;
}

.btn-skip:active{
  transform:scale(.97);
}

.btn-check{
  flex: 1 1 70%;
  height:100%;
  border-radius:12px;
  background: linear-gradient(100deg, #00eaff 0%, #3b82f6 55%, #6366f1 100%);
  border:1px solid rgba(255,255,255,.18);
  color:#02040a;
  font-weight:800;
  font-size: clamp(0.9rem, 2.2vh, 1rem);
  letter-spacing:.02em;
  cursor:pointer;
  transition: all .18s ease;
  box-shadow: 0 8px 22px rgba(0,234,255,.28);
}

.btn-check:active{
  transform:scale(.97);
}

.btn-check:disabled{
  opacity:.45;
  cursor:not-allowed;
  box-shadow:none;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  height:26px;
  padding:0 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#0d1528;
  font-size: clamp(0.68rem,1.7vh,0.76rem);
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}

.badge-cyan{
  border-color: rgba(0,234,255,.35);
  background: rgba(0,234,255,.12);
  color: var(--cyan);
}

.scale-btn{
  width:32px;
  height:32px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0d1528;
  color: var(--text);
  font-weight:800;
  font-size:0.78rem;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition: all .18s;
}

.scale-btn.active{
  border-color: var(--cyan);
  background: rgba(0,234,255,.18);
  color: var(--cyan);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}
</style>
