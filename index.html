<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Learning | Orbital Core</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030307;
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hologram-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Selector de Idioma Dinámico */
        .system-status {
            position: absolute;
            top: 6vh;
            display: flex;
            gap: 15px;
            background: rgba(0, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .lang-tab {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #557777;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .lang-tab.active {
            color: #0ff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            font-weight: 900;
        }

        /* Esfera Electrónica Estilo Planeta Burbuja con Textura de Puntos */
        .electronic-planet {
            position: relative;
            width: 65vmin;
            height: 65vmin;
            max-width: 380px;
            max-height: 380px;
            border-radius: 50%;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            
            background: radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.2), rgba(2, 2, 10, 0.95)),
                        radial-gradient(rgba(0, 255, 255, 0.15) 2px, transparent 2px);
            background-size: 100% 100%, 20px 20px;
            
            box-shadow: 
                0 0 60px rgba(0, 255, 255, 0.3), 
                inset 0 0 50px rgba(0, 255, 255, 0.6),
                inset 0 0 90px rgba(0, 0, 255, 0.4);
            border: 2px solid rgba(0, 255, 255, 0.4);
            will-change: background-position;
        }

        .electronic-planet:active {
            cursor: grabbing;
        }

        /* Anillo orbital holográfico */
        .electronic-planet::before {
            content: '';
            position: absolute;
            width: 115%;
            height: 115%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 255, 255, 0.2);
            animation: spinRing 20s linear infinite;
            pointer-events: none;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        /* Número Central Grueso y Fusionado */
        .class-number {
            font-size: 28vmin;
            font-weight: 900;
            color: #e0ffff;
            text-shadow: 
                0 0 10px #0ff, 
                0 0 20px #0ff, 
                0 0 40px #00f, 
                0 0 70px #00f;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 10;
        }

        /* Botón de Acceso */
        .access-btn {
            position: absolute;
            bottom: 12vh;
            padding: 14px 35px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-shadow: 0 0 5px #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .access-btn:hover, .access-btn:active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }

        #statusText {
            position: absolute;
            bottom: 5vh;
            font-size: 0.75rem;
            color: #666;
            font-family: monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>

    <div class="hologram-container">
        <!-- Selector interactivo Español / Alemán -->
        <div class="system-status">
            <span class="lang-tab active" id="tabEs" onclick="setLanguage('ES')">ESPAÑOL</span>
            <span class="lang-tab" id="tabDe" onclick="setLanguage('DE')">DEUTSCH</span>
        </div>
        
        <div class="electronic-planet" id="planet">
            <div class="class-number" id="displayNumber">1</div>
        </div>

        <button class="access-btn" id="enterBtn">INICIAR CLASE 1</button>
        <div id="statusText">Escaneando archivos locales...</div>
    </div>

    <script>
        let currentLang = 'ES';
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('tabEs').classList.toggle('active', lang === 'ES');
            document.getElementById('tabDe').classList.toggle('active', lang === 'DE');
            updateButtonText();
        }

        function updateButtonText() {
            const btn = document.getElementById('enterBtn');
            if (currentLang === 'ES') {
                btn.innerText = `INICIAR CLASE ${currentClass}`;
            } else {
                btn.innerText = `KURS ${currentClass} STARTEN`;
            }
        }

        // --- DETECCIÓN AUTOMÁTICA DE CLASES ---
        let maxAvailableClass = 1;
        const maxLimit = 365;
        const statusText = document.getElementById('statusText');

        async function checkAvailableClasses() {
            let checking = true;
            let currentCheck = 2;
            while (checking && currentCheck <= maxLimit) {
                try {
                    const response = await fetch(`class${currentCheck}.html`, { method: 'HEAD' });
                    if (response.ok) {
                        maxAvailableClass = currentCheck;
                        currentCheck++;
                    } else {
                        checking = false;
                    }
                } catch {
                    checking = false;
                }
            }
            statusText.innerText = `CLASES ACTIVAS DISPONIBLES: ${maxAvailableClass}`;
            statusText.style.color = '#0aa';
            setTimeout(() => { statusText.style.opacity = '0'; }, 4000);
        }
        checkAvailableClasses();

        // --- AUDIO DIGITAL ELEGANTE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playDigitalTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // --- MECÁNICA DE FÍSICA INERCIAL Y ARRASTRE FLUIDO ---
        const planet = document.getElementById('planet');
        const numberDisplay = document.getElementById('displayNumber');

        let currentClass = 1;
        let isDragging = false;
        let startX = 0, startY = 0;
        let lastX = 0, lastY = 0;
        let velocityX = 0, velocityY = 0;
        let inertiaId = null;
        
        let accumulatedDelta = 0;
        let texturePosX = 0;
        let texturePosY = 0;
        
        const threshold = 35; // Sensibilidad de distancia para cambiar de número

        function changeClassBy(amount) {
            let next = currentClass + amount;
            if (next < 1) next = 1;
            if (next > maxAvailableClass) next = maxAvailableClass;
            if (next !== currentClass) {
                currentClass = next;
                numberDisplay.innerText = currentClass;
                updateButtonText();
                playDigitalTick();
            }
        }

        // Eventos de inicio de interacción
        function onPointerStart(x, y) {
            isDragging = true;
            startX = lastX = x;
            startY = lastY = y;
            accumulatedDelta = 0;
            if (inertiaId) cancelAnimationFrame(inertiaId);
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Movimiento en tiempo real (Sosteniendo el dedo / Clic)
        function onPointerMove(x, y) {
            if (!isDragging) return;

            const deltaX = x - lastX;
            const deltaY = y - lastY;
            
            // Velocidad instantánea para inercia al soltar
            velocityX = deltaX;
            velocityY = deltaY;

            // Movimiento controlado según el tamaño del desplazamiento del dedo
            accumulatedDelta += deltaX;

            // Desplazamiento dinámico del fondo de puntitos de la esfera y del fondo espacial en conjunto
            texturePosX += deltaX * 0.4;
            texturePosY += deltaY * 0.4;
            planet.style.backgroundPosition = `${texturePosX}px ${texturePosY}px`;

            if (Math.abs(accumulatedDelta) >= threshold) {
                const steps = Math.trunc(accumulatedDelta / threshold);
                changeClassBy(-steps); // Invertido natural para que arrastrar a la derecha baje o suba intuitivamente
                accumulatedDelta %= threshold;
            }

            lastX = x;
            lastY = y;
        }

        // Al soltar: Efecto Inercial en el vacío con frenado proporcional
        function onPointerEnd() {
            if (!isDragging) return;
            isDragging = false;

            let currentVelocity = Math.abs(velocityX) > Math.abs(velocityY) ? velocityX : velocityY;
            let momentum = currentVelocity * 0.8; // Factor de impulso proporcional al tirón

            function applyInertia() {
                if (Math.abs(momentum) > 0.5) {
                    texturePosX += momentum * 0.3;
                    texturePosY += momentum * 0.3;
                    planet.style.backgroundPosition = `${texturePosX}px ${texturePosY}px`;

                    accumulatedDelta += momentum;
                    if (Math.abs(accumulatedDelta) >= threshold) {
                        const steps = Math.trunc(accumulatedDelta / threshold);
                        changeClassBy(-steps);
                        accumulatedDelta %= threshold;
                    }

                    momentum *= 0.92; // Fricción espacial simulada para que se detenga suavemente
                    inertiaId = requestAnimationFrame(applyInertia);
                }
            }
            if (Math.abs(currentVelocity) > 2) {
                inertiaId = requestAnimationFrame(applyInertia);
            }
        }

        // Listeners táctiles
        planet.addEventListener('touchstart', e => onPointerStart(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => { if(isDragging) onPointerMove(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', onPointerEnd);

        // Listeners de mouse
        planet.addEventListener('mousedown', e => onPointerStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => { if(isDragging) onPointerMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', onPointerEnd);

        // Click de acceso
        document.getElementById('enterBtn').addEventListener('click', () => {
            window.location.href = `class${currentClass}.html`;
        });
        planet.addEventListener('click', () => {
            if (Math.abs(startX - lastX) < 5) {
                window.location.href = `class${currentClass}.html`;
            }
        });


        // --- FONDO DE ESTRELLAS Y GALAXIAS MEJORADO ---
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 350; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.6,
                    alpha: Math.random(),
                    speed: Math.random() * 0.3 + 0.05
                });
            }
        }

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);
            
            let bgGrad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height));
            bgGrad.addColorStop(0, '#060614');
            bgGrad.addColorStop(1, '#020205');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                star.y -= star.speed;
                star.alpha += (Math.random() - 0.5) * 0.04;
                if(star.alpha < 0.1) star.alpha = 0.1;
                if(star.alpha > 1) star.alpha = 1;

                if (star.y < 0) {
                    star.y = height;
                    star.x = Math.random() * width;
                }
            });
            requestAnimationFrame(animateSpace);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateSpace();
    </script>
</body>
</html>
