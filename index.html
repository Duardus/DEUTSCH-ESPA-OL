<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrenador Cuento: Alemán - Español</title>
    <!-- Librería de fuegos artificiales -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600&display=swap');

        :root {
            --bg-color: #070913;
            --card-bg: #101726;
            --text-color: #f1f5f9;
            --accent: #00f0ff;
            --success: #00ff88;
            --error: #ff0055;
            --border: #1e293b;
            --glow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.08), transparent 40%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .app-wrapper {
            width: 100%;
            max-width: 440px;
            height: 94vh;
            max-height: 750px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .screen.active {
            display: flex;
        }

        h1, h2 {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Pantalla Inicio */
        .intro-container {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 15px;
        }

        .intro-container h1 {
            color: var(--accent);
            font-size: 2rem;
            text-shadow: var(--glow);
        }

        .name-input {
            width: 100%;
            padding: 15px;
            background: #05070d;
            border: 2px solid var(--border);
            border-radius: 14px;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        /* Estructura Juego */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .mode-btn {
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .stats-hud {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .prompt-box {
            background: #070913;
            border-radius: 16px;
            padding: 20px;
            border-left: 4px solid var(--accent);
            margin-bottom: 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .prompt-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .target-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .english-hint {
            font-size: 0.85rem;
            color: #64748b;
            font-style: italic;
            display: none; /* Se muestra solo al fallar */
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .user-answer {
            width: 100%;
            padding: 14px;
            background: #05070d;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s;
        }

        .user-answer:focus {
            border-color: var(--accent);
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent), #0077ff);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
            transition: transform 0.1s;
        }

        .btn-main:active { transform: scale(0.97); }

        /* Feedback y Errores */
        .feedback-card {
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            margin-bottom: 10px;
        }

        .feedback-card.success {
            background: rgba(0, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
            display: block;
        }

        .feedback-card.error {
            background: rgba(255, 0, 85, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
            display: block;
        }

        .correct-reveal {
            display: block;
            font-size: 1.1rem;
            color: #fff;
            font-weight: bold;
            margin: 6px 0;
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 6px;
        }

        /* Pantalla Estadísticas (Captura WhatsApp) */
        .stats-screen {
            justify-content: space-between;
            overflow-y: auto;
        }

        .stats-card {
            background: #070913;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border);
            margin: 10px 0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
            font-size: 0.9rem;
        }
        .stat-row:last-child { border: none; }

        .stat-val { font-weight: bold; color: var(--accent); }
        .stat-val.green { color: var(--success); }

        .mini-list {
            list-style: none;
            max-height: 90px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .mini-list li {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.03);
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- PANTALLA 1: INICIO -->
    <div id="screen-intro" class="screen intro-container active">
        <h1>Entrenador Literario</h1>
        <p style="color: #94a3b8; font-size: 0.85rem;">Sistema dinámico con bloques de 3 oraciones.</p>
        <input type="text" id="input-name" class="name-input" placeholder="Tu Nombre aquí..." autocomplete="off">
        <button class="btn-main" style="width: 100%;" onclick="startApp()">Iniciar Desafío ➔</button>
    </div>

    <!-- PANTALLA 2: JUEGO -->
    <div id="screen-game" class="screen">
        <div class="top-bar">
            <h2 id="app-title" style="font-size: 1.1rem; color: var(--accent);">Cuento Alemán-Español</h2>
            <button class="mode-btn" onclick="toggleLanguageMode()" id="mode-toggle-btn">DE ➔ ES</button>
        </div>

        <div class="stats-hud">
            <span id="hud-progress">Progreso: 0 / 25</span>
            <span id="hud-streak">Racha: 0/3</span>
        </div>

        <div class="prompt-box">
            <div class="prompt-label" id="label-instruction">Traduce al Español:</div>
            <div class="target-text" id="display-target"></div>
            <div class="english-hint" id="display-hint"></div>
        </div>

        <div id="feedback-box" class="feedback-card"></div>

        <div class="input-area">
            <input type="text" id="user-input" class="user-answer" placeholder="Escribe tu respuesta..." autocomplete="off">
            <button class="btn-main" id="action-btn" onclick="handleAction()">Comprobar</button>
        </div>
    </div>

    <!-- PANTALLA 3: ESTADÍSTICAS FINAL -->
    <div id="screen-stats" class="screen stats-screen">
        <div>
            <h2 style="color: var(--success); font-size: 1.5rem; margin-bottom: 2px;">¡Felicidades!</h2>
            <p id="final-greeting" style="text-align: center; font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px;"></p>
        </div>

        <!-- Tarjeta lista para captura de pantalla de WhatsApp -->
        <div class="stats-card" id="whatsapp-capture-area">
            <div style="text-align:center; font-family:'Rajdhani'; font-weight:700; color:var(--accent); margin-bottom:8px; font-size:1rem;">⚡ RESUMEN DE RENDIMIENTO ⚡</div>
            <div class="stat-row">
                <span>Tiempo total:</span>
                <span class="stat-val" id="stat-time">00:00</span>
            </div>
            <div class="stat-row">
                <span>Precisión global:</span>
                <span class="stat-val green" id="stat-accuracy">0%</span>
            </div>

            <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 8px;">🔥 Oraciones más retadoras:</div>
            <ul class="mini-list" id="list-hard"></ul>

            <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 6px;">✨ Dominadas sin fallo:</div>
            <ul class="mini-list" id="list-easy"></ul>
        </div>

        <button class="btn-main" onclick="location.reload()" style="margin-top: 5px;">Jugar de Nuevo ➔</button>
    </div>
</div>

<script>
    const database = [
        { es: "En una pequeña ciudad", de: "In einer kleinen Stadt", en: "In a small town" },
        { es: "un hombre viejo vivía solo.", de: "ein alter Mann lebte allein.", en: "an old man lived alone." },
        { es: "Todos los días miraba la puerta", de: "Jeden Tag sah er die Tür an", en: "Every day he looked at the door" },
        { es: "y esperaba.", de: "und wartete.", en: "and waited." },
        { es: "El tiempo pasa rápido", de: "Die Zeit vergeht schnell", en: "Time passes quickly" },
        { es: "cuando el corazón busca algo.", de: "wenn das Herz etwas sucht.", en: "when the heart looks for something." },
        { es: "Nadie sabía qué había detrás de esa puerta cerrada.", de: "Niemand wusste, was hinter dieser geschlossenen Tür war.", en: "Nobody knew what was behind that closed door." },
        { es: "Nunca se abría,", de: "Sie öffnete sich nie,", en: "It never opened," },
        { es: "pero a veces se escuchaba", de: "aber manchmal hörte man", en: "but sometimes was heard" },
        { es: "una voz suave.", de: "eine sanfte Stimme.", en: "a soft voice." },
        { es: "Una noche oscura", de: "Eines dunklen Nachts", en: "One dark night" },
        { es: "la llave cayó al suelo.", de: "fiel der Schlüssel auf den Boden.", en: "the key fell to the floor." },
        { es: "El hombre tomó la llave fría", de: "Der Mann nahm den kalten Schlüssel", en: "The man took the cold key" },
        { es: "con su mano.", de: "mit seiner Hand.", en: "with his hand." },
        { es: "Tenía miedo de abrir,", de: "Er hatte Angst sie zu öffnen,", en: "He was afraid to open," },
        { es: "porque el amor cambia la vida.", de: "denn die Liebe verändert das Leben.", en: "because love changes life." },
        { es: "Abrió lentamente.", de: "Er öffnete sie langsam.", en: "He opened it slowly." },
        { es: "La habitación estaba vacía.", de: "Das Zimmer war leer.", en: "The room was empty." },
        { es: "Sobre la mesa había un espejo.", de: "Auf dem Tisch war ein Spiegel.", en: "On the table was a mirror." },
        { es: "Al mirar, vio su rostro", de: "Beim Hineinsehen sah er sein Gesicht", en: "Looking, he saw his face" },
        { es: "y comprendió la verdad:", de: "und verstand die Wahrheit:", en: "and understood the truth:" },
        { es: "la persona que buscaba", de: "die Person, die er suchte", en: "the person he was looking for" },
        { es: "estaba dentro de él.", de: "war in ihm.", en: "was inside him." },
        { es: "Para amar a otro", de: "Um einen anderen zu lieben", en: "To love another" },
        { es: "debes encontrar la paz en tu propio corazón.", de: "musst du Frieden in deinem eigenen Herzen finden.", en: "you must find peace in your own heart." }
    ];

    let playerName = "";
    let pool = [];
    let activeGroup = [];
    let currentItem = null;
    let forcedItem = null; // Fuerza la repetición inmediata tras un error
    let streaks = {};
    let completedCount = 0;
    let isGermanToSpanish = true;
    let gameState = "QUESTION"; // "QUESTION", "ERROR_WAIT", "SUCCESS_WAIT"

    // Analíticas
    let startTime = 0;
    let totalAttempts = 0;
    let totalErrors = 0;
    let itemAnalytics = [];

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startApp() {
        const input = document.getElementById('input-name').value.trim();
        playerName = input === "" ? "Estudiante" : input;

        startTime = Date.now();
        totalAttempts = 0;
        totalErrors = 0;
        itemAnalytics = database.map((_, i) => ({ index: i, errors: 0, successes: 0 }));

        pool = [...database];
        activeGroup = [];
        completedCount = 0;
        forcedItem = null;
        streaks = {};
        database.forEach((_, i) => streaks[i] = 0);

        switchScreen('screen-game');
        loadNextQuestion();
    }

    function refillActiveGroup() {
        while (activeGroup.length < 3 && pool.length > 0) {
            activeGroup.push(pool.shift());
        }
    }

    function loadNextQuestion() {
        gameState = "QUESTION";
        const btn = document.getElementById('action-btn');
        btn.textContent = "Comprobar";
        btn.style.background = "";
        
        document.getElementById('feedback-box').className = "feedback-card";
        document.getElementById('feedback-box').style.display = "none";
        document.getElementById('display-hint').style.display = "none";

        refillActiveGroup();

        if (activeGroup.length === 0) {
            finishGame();
            return;
        }

        // Lógica de repetición inmediata por error o aleatoria dentro del bloque de 3
        if (forcedItem && activeGroup.includes(forcedItem)) {
            currentItem = forcedItem;
            forcedItem = null; // Consumido
        } else {
            const randomIndex = Math.floor(Math.random() * activeGroup.length);
            currentItem = activeGroup[randomIndex];
        }

        const origIdx = database.indexOf(currentItem);

        // Renderizado dinámico según el conmutador de idioma
        if (isGermanToSpanish) {
            document.getElementById('label-instruction').textContent = "Traduce al Español:";
            document.getElementById('display-target').textContent = currentItem.de;
        } else {
            document.getElementById('label-instruction').textContent = "Traduce al Alemán:";
            document.getElementById('display-target').textContent = currentItem.es;
        }

        document.getElementById('display-hint').textContent = `Pista en Inglés: ${currentItem.en}`;
        document.getElementById('hud-streak').textContent = `Racha: ${streaks[origIdx]}/3`;
        document.getElementById('hud-progress').textContent = `Progreso: ${completedCount} /${database.length}`;

        const inputEl = document.getElementById('user-input');
        inputEl.value = "";
        inputEl.disabled = false;
        setTimeout(() => inputEl.focus(), 50);
    }

    function normalize(text) {
        return text.trim().toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
    }

    function handleAction() {
        if (gameState === "ERROR_WAIT" || gameState === "SUCCESS_WAIT") {
            loadNextQuestion();
            return;
        }
        evaluateAnswer();
    }

    function evaluateAnswer() {
        if (!currentItem) return;

        const userVal = document.getElementById('user-input').value;
        const correctVal = isGermanToSpanish ? currentItem.es : currentItem.de;
        const origIdx = database.indexOf(currentItem);
        const feedbackBox = document.getElementById('feedback-box');
        const btn = document.getElementById('action-btn');
        const inputEl = document.getElementById('user-input');

        totalAttempts++;
        inputEl.disabled = true;

        if (normalize(userVal) === normalize(correctVal)) {
            // Acierto correcto
            streaks[origIdx]++;
            itemAnalytics[origIdx].successes++;

            if (streaks[origIdx] >= 3) {
                feedbackBox.innerHTML = `<strong>¡Excelente!</strong> 3 aciertos seguidos. Frase dominada y retirada del grupo.`;
                activeGroup = activeGroup.filter(item => item !== currentItem);
                completedCount++;
            } else {
                feedbackBox.innerHTML = `<strong>¡Correcto!</strong> Llevas ${streaks[origIdx]}/3 aciertos consecutivos.`;
            }

            feedbackBox.className = "feedback-card success";
            feedbackBox.style.display = "block";

            gameState = "SUCCESS_WAIT";
            btn.textContent = "Siguiente ➔";
            btn.style.background = "linear-gradient(135deg, #00ff88, #00b35f)";

            // Auto-avance rápido en aciertos (1.2 segundos) pero permitiendo clic manual inmediato
            setTimeout(() => { if (gameState === "SUCCESS_WAIT") loadNextQuestion(); }, 1200);

        } else {
            // Error detectado
            streaks[origIdx] = 0;
            forcedItem = currentItem; // Se obliga a preguntar de nuevo inmediatamente
            totalErrors++;
            itemAnalytics[origIdx].errors++;

            document.getElementById('hud-streak').textContent = `Racha: 0/3`;
            document.getElementById('display-hint').style.display = "block"; // Revela pista en inglés

            feedbackBox.innerHTML = `
                <div style="font-weight:700; margin-bottom:4px;">INCORRECTO</div>
                La respuesta exacta era:
                <span class="correct-reveal">${correctVal}</span>
                <span style="font-size:0.8rem; color:#94a3b8; display:block; margin-top:4px;">Analiza bien, la repetiremos enseguida.</span>
            `;
            feedbackBox.className = "feedback-card error";
            feedbackBox.style.display = "block";

            gameState = "ERROR_WAIT";
            btn.textContent = "Entendido, Repetir ➔";
            btn.style.background = "linear-gradient(135deg, #ff0055, #cc0044)";
        }
    }

    function toggleLanguageMode() {
        isGermanToSpanish = !isGermanToSpanish;
        document.getElementById('mode-toggle-btn').textContent = isGermanToSpanish ? "DE ➔ ES" : "ES ➔ DE";
        if (gameState === "QUESTION") loadNextQuestion();
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAction();
    });

    function fireConfetti() {
        let duration = 4 * 1000;
        let end = Date.now() + duration;
        (function frame() {
            confetti({
                particleCount: 4,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#00f0ff', '#ff0055', '#00ff88']
            });
            confetti({
                particleCount: 4,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#00f0ff', '#ff0055', '#00ff88']
            });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    function finishGame() {
        switchScreen('screen-stats');
        fireConfetti();

        document.getElementById('final-greeting').textContent = `¡Impresionante trabajo, ${playerName}! Completaste todo el cuento en ambos idiomas.`;

        // Calcular Tiempo
        let totalSecs = Math.floor((Date.now() - startTime) / 1000);
        let m = Math.floor(totalSecs / 60);
        let s = totalSecs % 60;
        document.getElementById('stat-time').textContent = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;

        // Precisión
        let accuracy = totalAttempts === 0 ? 100 : ((totalAttempts - totalErrors) / totalAttempts) * 100;
        document.getElementById('stat-accuracy').textContent = accuracy.toFixed(1) + "%";

        // Ordenar analíticas por errores
        let sorted = [...itemAnalytics].sort((a,b) => b.errors - a.errors);

        // Más difíciles
        let hardList = document.getElementById('list-hard');
        hardList.innerHTML = '';
        let hardItems = sorted.filter(x => x.errors > 0).slice(0, 3);
        if(hardItems.length === 0) {
            hardList.innerHTML = `<li><span>¡Perfecto! Sin errores registrados.</span><span>0 fallos</span></li>`;
        } else {
            hardItems.forEach(item => {
                let txt = database[item.index].de;
                hardList.innerHTML += `<li><span style="max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${txt}</span><span style="color:var(--error); font-weight:bold;">${item.errors} fallos</span></li>`;
            });
        }

        // Más fáciles
        let easyList = document.getElementById('list-easy');
        easyList.innerHTML = '';
        let easyItems = sorted.filter(x => x.errors === 0).slice(0, 3);
        if(easyItems.length === 0) {
            easyList.innerHTML = `<li><span>Todas requirieron práctica. ¡Buen esfuerzo!</span></li>`;
        } else {
            easyItems.forEach(item => {
                let txt = database[item.index].de;
                easyList.innerHTML += `<li><span style="max-width:75%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${txt}</span><span style="color:var(--success); font-weight:bold;">Impecable</span></li>`;
            });
        }
    }
</script>

</body>
</html>
