<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrenador Literario: Alemán-Español</title>
    <!-- Librería de fuegos artificiales -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-base: #05070f;
            --card-surface: rgba(16, 23, 38, 0.98);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #00f0ff;
            --success: #00ff88;
            --error: #ff0055;
            --border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.06), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 85, 0.04), transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            padding: 4px;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 96dvh;
            max-height: 100%;
            background: var(--card-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centrado total y armónico */
            gap: 10px;
            padding: 12px;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            justify-content: center;
            gap: 10px;
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: flex;
        }

        h1, h2 {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* --- Pantalla de Inicio --- */
        .intro-screen {
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .intro-screen h1 {
            color: var(--accent);
            font-size: 1.6rem;
            text-shadow: var(--glow);
        }

        .intro-screen p {
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.3;
            max-width: 260px;
        }

        .name-input {
            width: 100%;
            padding: 10px;
            background: #090d16;
            border: 2px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        /* --- Pantalla de Juego --- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            width: 100%;
        }

        .mode-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
        }

        .hud-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
        }

        /* TARJETA COMPACTA Y SIN HUECOS */
        .prompt-card {
            background: #090d16;
            border-radius: 12px;
            padding: 16px 14px;
            border-left: 3px solid var(--accent);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        .prompt-tag {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .target-sentence {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.25;
        }

        .english-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 4px;
            display: none;
        }

        .action-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .user-input {
            width: 100%;
            padding: 10px;
            background: #090d16;
            border: 2px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
            transition: all 0.2s;
        }

        .user-input:focus {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent), #0077ff);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 240, 255, 0.2);
            transition: transform 0.1s;
            width: 100%;
        }

        .btn-main:active { transform: scale(0.97); }

        /* Tarjeta de Feedback Interactiva */
        .feedback-box {
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.72rem;
            display: none;
            line-height: 1.2;
            width: 100%;
        }

        .feedback-box.success {
            background: rgba(0, 255, 136, 0.08);
            color: var(--success);
            border: 1px solid rgba(0, 255, 136, 0.3);
            display: block;
        }

        .feedback-box.error {
            background: rgba(255, 0, 85, 0.08);
            color: var(--error);
            border: 1px solid rgba(255, 0, 85, 0.3);
            display: block;
        }

        .correct-answer-text {
            display: block;
            font-size: 0.85rem;
            color: #fff;
            font-weight: bold;
            margin-top: 2px;
            background: rgba(0,0,0,0.3);
            padding: 3px;
            border-radius: 4px;
        }

        /* --- Pantalla de Estadísticas Finales --- */
        .stats-screen {
            text-align: center;
            gap: 10px;
        }

        .stats-card {
            background: #090d16;
            border-radius: 10px;
            padding: 8px;
            border: 1px solid var(--border);
            text-align: left;
            width: 100%;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.06);
            font-size: 0.72rem;
        }
        .stat-row:last-child { border: none; }

        .stat-value { font-weight: bold; color: var(--accent); }
        .stat-value.green { color: var(--success); }

        .mini-list {
            list-style: none;
            max-height: 50px;
            overflow-y: auto;
            margin-top: 3px;
        }

        .mini-list li {
            font-size: 0.6rem;
            background: rgba(255,255,255,0.03);
            padding: 3px 5px;
            border-radius: 4px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- PANTALLA 1: INICIO -->
    <div id="screen-intro" class="screen intro-screen active">
        <div>
            <h1>Entrenador Alemán</h1>
            <p>Sistema inteligente de bloques de 3 oraciones con refuerzo inmediato de errores.</p>
        </div>
        <input type="text" id="input-name" class="name-input" placeholder="Ingresa tu nombre..." autocomplete="off">
        <button class="btn-main" onclick="startApp()">Comenzar Desafío ➔</button>
    </div>

    <!-- PANTALLA 2: JUEGO -->
    <div id="screen-game" class="screen">
        <div class="game-header">
            <h2 style="font-size: 0.85rem; color: var(--accent);">Cuento Interactivo</h2>
            <button class="mode-badge" onclick="toggleLanguageMode()" id="mode-toggle-btn">DE ➔ ES</button>
        </div>

        <div class="hud-stats">
            <span id="hud-progress">Progreso: 0/25</span>
            <span id="hud-streak">Racha: 0/3</span>
        </div>

        <div class="prompt-card">
            <div class="prompt-tag" id="label-instruction">Traduce al Español:</div>
            <div class="target-sentence" id="display-target"></div>
            <div class="english-hint" id="display-hint"></div>
        </div>

        <div id="feedback-box" class="feedback-box"></div>

        <div class="action-panel">
            <input type="text" id="user-input" class="user-input" placeholder="Escribe tu traducción..." autocomplete="off">
            <button class="btn-main" id="action-btn" onclick="handleAction()">Comprobar</button>
        </div>
    </div>

    <!-- PANTALLA 3: ESTADÍSTICAS FINAL -->
    <div id="screen-stats" class="screen stats-screen">
        <div>
            <h2 style="color: var(--success); font-size: 1rem; margin-bottom: 2px;">¡Misión Cumplida!</h2>
            <p id="final-greeting" style="font-size: 0.68rem; color: var(--text-muted);"></p>
        </div>

        <div class="stats-card" id="whatsapp-capture-area">
            <div style="text-align:center; font-family:'Rajdhani'; font-weight:700; color:var(--accent); margin-bottom:3px; font-size:0.7rem;">⚡ RESUMEN DE RENDIMIENTO ⚡</div>
            <div class="stat-row">
                <span>Tiempo total:</span>
                <span class="stat-value" id="stat-time">00:00</span>
            </div>
            <div class="stat-row">
                <span>Precisión global:</span>
                <span class="stat-value green" id="stat-accuracy">0%</span>
            </div>

            <div style="font-size: 0.58rem; color: var(--text-muted); margin-top: 3px;">🔥 Más retadoras:</div>
            <ul class="mini-list" id="list-hard"></ul>

            <div style="font-size: 0.58rem; color: var(--text-muted); margin-top: 2px;">✨ Impecables:</div>
            <ul class="mini-list" id="list-easy"></ul>
        </div>

        <button class="btn-main" onclick="location.reload()">Jugar de Nuevo ➔</button>
    </div>
</div>

<script>
    const database = [
        { es: "En una pequeña ciudad", de: "In einer kleinen Stadt", en: "In a small town" },
        { es: "un hombre viejo vivía solo.", de: "ein alter Mann lebte allein.", en: "an old man lived alone." },
        { es: "Todos los días miraba la puerta", de: "Jeden Tag sah er die Tür an", en: "Every day he looked at the door" },
        { es: "y esperaba.", de: "und wartete.", en: "and waited." },
        { es: "El tiempo pasa rápido", de: "Die Zeit vergeht schnell", en: "Time passes quickly" },
        { es: "cuando el corazón busca algo.", de: "wenn das Herz etwas sucht.", en: "when the heart looks for something." },
        { es: "Nadie sabía qué había detrás de esa puerta cerrada.", de: "Niemand wusste, was hinter dieser geschlossenen Tür war.", en: "Nobody knew what was behind that closed door." },
        { es: "Nunca se abría,", de: "Sie öffnete sich nie,", en: "It never opened," },
        { es: "pero a veces se escuchaba", de: "aber manchmal hörte man", en: "but sometimes was heard" },
        { es: "una voz suave.", de: "eine sanfte Stimme.", en: "a soft voice." },
        { es: "Una noche oscura", de: "Eines dunklen Nachts", en: "One dark night" },
        { es: "la llave cayó al suelo.", de: "fiel der Schlüssel auf den Boden.", en: "the key fell to the floor." },
        { es: "El hombre tomó la llave fría", de: "Der Mann nahm den kalten Schlüssel", en: "The man took the cold key" },
        { es: "con su mano.", de: "mit seiner Hand.", en: "with his hand." },
        { es: "Tenía miedo de abrir,", de: "Er hatte Angst sie zu öffnen,", en: "He was afraid to open," },
        { es: "porque el amor cambia la vida.", de: "denn die Liebe verändert das Leben.", en: "because love changes life." },
        { es: "Abrió lentamente.", de: "Er öffnete sie langsam.", en: "He opened it slowly." },
        { es: "La habitación estaba vacía.", de: "Das Zimmer war leer.", en: "The room was empty." },
        { es: "Sobre la mesa había un espejo.", de: "Auf dem Tisch war ein Spiegel.", en: "On the table was a mirror." },
        { es: "Al mirar, vio su rostro", de: "Beim Hineinsehen sah er sein Gesicht", en: "Looking, he saw his face" },
        { es: "y comprendió la verdad:", de: "und verstand die Wahrheit:", en: "and understood the truth:" },
        { es: "la persona que buscaba", de: "die Person, die er suchte", en: "the person he was looking for" },
        { es: "estaba dentro de él.", de: "war in ihm.", en: "was inside him." },
        { es: "Para amar a otro", de: "Um einen anderen zu lieben", en: "To love another" },
        { es: "debes encontrar la paz en tu propio corazón.", de: "musst du Frieden in deinem eigenen Herzen finden.", en: "you must find peace in your own heart." }
    ];

    let playerName = "";
    let pool = [];
    let activeGroup = [];
    let currentItem = null;
    let forcedItem = null; 
    let streaks = {};
    let completedCount = 0;
    let isGermanToSpanish = true;
    let gameState = "QUESTION";

    let startTime = 0;
    let totalAttempts = 0;
    let totalErrors = 0;
    let itemAnalytics = [];

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startApp() {
        const input = document.getElementById('input-name').value.trim();
        playerName = input === "" ? "Estudiante" : input;

        startTime = Date.now();
        totalAttempts = 0;
        totalErrors = 0;
        itemAnalytics = database.map((_, i) => ({ index: i, errors: 0, successes: 0 }));

        pool = [...database];
        activeGroup = [];
        completedCount = 0;
        forcedItem = null;
        streaks = {};
        database.forEach((_, i) => streaks[i] = 0);

        switchScreen('screen-game');
        loadNextQuestion();
    }

    function refillActiveGroup() {
        while (activeGroup.length < 3 && pool.length > 0) {
            activeGroup.push(pool.shift());
        }
    }

    function loadNextQuestion() {
        gameState = "QUESTION";
        const btn = document.getElementById('action-btn');
        btn.textContent = "Comprobar";
        btn.style.background = "";
        
        document.getElementById('feedback-box').className = "feedback-box";
        document.getElementById('feedback-box').style.display = "none";
        document.getElementById('display-hint').style.display = "none";

        refillActiveGroup();

        if (activeGroup.length === 0) {
            finishGame();
            return;
        }

        if (forcedItem && activeGroup.includes(forcedItem)) {
            currentItem = forcedItem;
            forcedItem = null; 
        } else {
            const randomIndex = Math.floor(Math.random() * activeGroup.length);
            currentItem = activeGroup[randomIndex];
        }

        const origIdx = database.indexOf(currentItem);

        if (isGermanToSpanish) {
            document.getElementById('label-instruction').textContent = "Traduce al Español:";
            document.getElementById('display-target').textContent = currentItem.de;
        } else {
            document.getElementById('label-instruction').textContent = "Traduce al Alemán:";
            document.getElementById('display-target').textContent = currentItem.es;
        }

        document.getElementById('display-hint').textContent = `Pista en Inglés: ${currentItem.en}`;
        document.getElementById('hud-streak').textContent = `Racha: ${streaks[origIdx]}/3`;
        document.getElementById('hud-progress').textContent = `Progreso: ${completedCount}/${database.length}`;

        const inputEl = document.getElementById('user-input');
        inputEl.value = "";
        inputEl.disabled = false;
        setTimeout(() => inputEl.focus(), 50);
    }

    function normalize(text) {
        return text.trim().toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
    }

    function handleAction() {
        if (gameState === "ERROR_WAIT" || gameState === "SUCCESS_WAIT") {
            loadNextQuestion();
            return;
        }
        evaluateAnswer();
    }

    function evaluateAnswer() {
        if (!currentItem) return;

        const userVal = document.getElementById('user-input').value;
        const correctVal = isGermanToSpanish ? currentItem.es : currentItem.de;
        const origIdx = database.indexOf(currentItem);
        const feedbackBox = document.getElementById('feedback-box');
        const btn = document.getElementById('action-btn');
        const inputEl = document.getElementById('user-input');

        totalAttempts++;
        inputEl.disabled = true;

        if (normalize(userVal) === normalize(correctVal)) {
            streaks[origIdx]++;
            itemAnalytics[origIdx].successes++;

            if (streaks[origIdx] >= 3) {
                feedbackBox.innerHTML = `<strong>¡Excelente!</strong> Frase dominada y retirada del grupo.`;
                activeGroup = activeGroup.filter(item => item !== currentItem);
                completedCount++;
            } else {
                feedbackBox.innerHTML = `<strong>¡Correcto!</strong> Llevas ${streaks[origIdx]}/3 aciertos consecutivos.`;
            }

            feedbackBox.className = "feedback-box success";
            feedbackBox.style.display = "block";

            gameState = "SUCCESS_WAIT";
            btn.textContent = "Siguiente ➔";
            btn.style.background = "linear-gradient(135deg, #00ff88, #00b35f)";

            setTimeout(() => { if (gameState === "SUCCESS_WAIT") loadNextQuestion(); }, 1200);

        } else {
            streaks[origIdx] = 0;
            forcedItem = currentItem; 
            totalErrors++;
            itemAnalytics[origIdx].errors++;

            document.getElementById('hud-streak').textContent = `Racha: 0/3`;
            document.getElementById('display-hint').style.display = "block"; 

            feedbackBox.innerHTML = `
                <div style="font-weight:700; margin-bottom:2px;">INCORRECTO</div>
                La respuesta exacta es:
                <span class="correct-answer-text">${correctVal}</span>
                <span style="font-size:0.62rem; color:var(--text-muted); display:block; margin-top:2px;">Analiza y repite enseguida.</span>
            `;
            feedbackBox.className = "feedback-box error";
            feedbackBox.style.display = "block";

            gameState = "ERROR_WAIT";
            btn.textContent = "Entendido, Repetir ➔";
            btn.style.background = "linear-gradient(135deg, #ff0055, #cc0044)";
        }
    }

    function toggleLanguageMode() {
        isGermanToSpanish = !isGermanToSpanish;
        document.getElementById('mode-toggle-btn').textContent = isGermanToSpanish ? "DE ➔ ES" : "ES ➔ DE";
        if (gameState === "QUESTION") loadNextQuestion();
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAction();
    });

    function fireConfetti() {
        let duration = 3.5 * 1000;
        let end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00f0ff', '#ff0055', '#00ff88'] });
            confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00f0ff', '#ff0055', '#00ff88'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    function finishGame() {
        switchScreen('screen-stats');
        fireConfetti();

        document.getElementById('final-greeting').textContent = `¡Excelente ritmo, ${playerName}!`;

        let totalSecs = Math.floor((Date.now() - startTime) / 1000);
        let m = Math.floor(totalSecs / 60);
        let s = totalSecs % 60;
        document.getElementById('stat-time').textContent = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;

        let accuracy = totalAttempts === 0 ? 100 : ((totalAttempts - totalErrors) / totalAttempts) * 100;
        document.getElementById('stat-accuracy').textContent = accuracy.toFixed(1) + "%";

        let sorted = [...itemAnalytics].sort((a,b) => b.errors - a.errors);

        let hardList = document.getElementById('list-hard');
        hardList.innerHTML = '';
        let hardItems = sorted.filter(x => x.errors > 0).slice(0, 2);
        if(hardItems.length === 0) {
            hardList.innerHTML = `<li><span>¡Cero errores registrados!</span><span style="color:var(--success)">Perfecto</span></li>`;
        } else {
            hardItems.forEach(item => {
                let txt = database[item.index].de;
                hardList.innerHTML += `<li><span style="max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${txt}</span><span style="color:var(--error); font-weight:bold;">${item.errors} fallos</span></li>`;
            });
        }

        let easyList = document.getElementById('list-easy');
        easyList.innerHTML = '';
        let easyItems = sorted.filter(x => x.errors === 0).slice(0, 2);
        if(easyItems.length === 0) {
            easyList.innerHTML = `<li><span>¡Gran esfuerzo general!</span></li>`;
        } else {
            easyItems.forEach(item => {
                let txt = database[item.index].de;
                easyList.innerHTML += `<li><span style="max-width:75%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${txt}</span><span style="color:var(--success); font-weight:bold;">Impecable</span></li>`;
            });
        }
    }
</script>

</body>
</html>
