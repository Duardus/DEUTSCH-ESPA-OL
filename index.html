<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Learning | Index</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #05050a;
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Evita recargas y scrolls del navegador en móviles */
        }

        /* Fondo del Espacio */
        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor Principal Cero Vacíos */
        .hologram-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Título Flotante */
        .system-status {
            position: absolute;
            top: 5vh;
            color: #0ff;
            font-size: 1rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* Esfera Electrónica */
        .electronic-planet {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            max-width: 400px;
            max-height: 400px;
            border-radius: 50%;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Efecto Cyberpunk/Cristal */
            background: radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.15), rgba(0, 0, 20, 0.9)),
                        url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M 0 40 L 40 0" stroke="rgba(0,255,255,0.2)" stroke-width="1" fill="none"/><path d="M 0 0 L 40 40" stroke="rgba(0,255,255,0.2)" stroke-width="1" fill="none"/></svg>');
            background-size: cover, 40px 40px;
            box-shadow: 
                0 0 50px rgba(0, 255, 255, 0.4), 
                inset 0 0 40px rgba(0, 255, 255, 0.8),
                inset 0 0 80px rgba(0, 0, 255, 0.5);
            border: 2px solid rgba(0, 255, 255, 0.3);
            
            transition: box-shadow 0.3s ease;
        }

        .electronic-planet:active {
            cursor: grabbing;
            box-shadow: 
                0 0 70px rgba(0, 255, 255, 0.7), 
                inset 0 0 60px rgba(0, 255, 255, 1);
        }

        /* Eje de rotación holográfico */
        .electronic-planet::before {
            content: '';
            position: absolute;
            top: -5%;
            left: 50%;
            width: 2px;
            height: 110%;
            background: linear-gradient(to bottom, transparent, rgba(0,255,255,0.8), transparent);
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* Número Central Fusionado */
        .class-number {
            font-size: 30vmin;
            font-weight: 900;
            color: #e0ffff;
            text-shadow: 
                0 0 10px #0ff, 
                0 0 20px #0ff, 
                0 0 40px #00f, 
                0 0 80px #00f;
            mix-blend-mode: screen; /* Fusión perfecta con la esfera */
            pointer-events: none;
            z-index: 10;
        }

        /* Botón de Acceso */
        .access-btn {
            position: absolute;
            bottom: 10vh;
            padding: 15px 40px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border-radius: 5px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-shadow: 0 0 5px #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .access-btn:hover, .access-btn:active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }

        /* Loader mientras busca las clases disponibles */
        #statusText {
            position: absolute;
            bottom: 5vh;
            font-size: 0.8rem;
            color: #888;
            font-family: monospace;
        }

    </style>
</head>
<body>

    <!-- Fondo de estrellas y galaxias -->
    <canvas id="spaceCanvas"></canvas>

    <div class="hologram-container">
        <div class="system-status">SELECTOR DE NÚCLEO</div>
        
        <!-- Esfera central interactiva -->
        <div class="electronic-planet" id="planet">
            <div class="class-number" id="displayNumber">1</div>
        </div>

        <button class="access-btn" id="enterBtn">INICIAR CLASE 1</button>
        <div id="statusText">Escaneando sistema de archivos...</div>
    </div>

    <script>
        // --- LÓGICA DE Detección de Clases Existentes (Background Fetch) ---
        let maxAvailableClass = 1; // Mínimo siempre existirá la 1
        const maxLimit = 365;
        const statusText = document.getElementById('statusText');

        async function checkAvailableClasses() {
            let checking = true;
            let currentCheck = 2; // Empezamos a buscar desde la 2

            while (checking && currentCheck <= maxLimit) {
                try {
                    // Petición HEAD para ver si existe sin descargar la página entera
                    const response = await fetch(`class${currentCheck}.html`, { method: 'HEAD' });
                    if (response.ok) {
                        maxAvailableClass = currentCheck;
                        currentCheck++;
                    } else {
                        checking = false; // Se rompió la cadena, hasta aquí llegamos
                    }
                } catch (error) {
                    checking = false; // Error de red (trabajando en local file:// puede fallar)
                }
            }
            statusText.innerText = `NÚCLEOS DETECTADOS: ${maxAvailableClass}`;
            statusText.style.color = '#0ff';
            setTimeout(() => { statusText.style.opacity = '0'; }, 3000);
        }

        // Iniciar escaneo de inmediato
        checkAvailableClasses();


        // --- LÓGICA DEL SINTETIZADOR DE AUDIO (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playDigitalTick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine'; // Onda limpia digital
            // Frecuencia que baja rápidamente para simular un "Blip" de scroll
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volumen bajo y elegante
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }


        // --- LÓGICA DE INTERACCIÓN DE LA ESFERA (Swipe/Arrastre) ---
        const planet = document.getElementById('planet');
        const numberDisplay = document.getElementById('displayNumber');
        const enterBtn = document.getElementById('enterBtn');

        let currentClass = 1;
        let isDragging = false;
        let startY = 0;
        let startX = 0;
        let accumulatedDelta = 0;
        let rotationX = 0; // Para el efecto visual de giro

        // Sensibilidad: Cuántos píxeles debes arrastrar para cambiar de número.
        // Si mueves rápido, la acumulación es grande y cambia los números rapidísimo.
        const sensitivity = 25; 

        function updateDisplay(nuevoNumero) {
            if (nuevoNumero !== currentClass && nuevoNumero >= 1 && nuevoNumero <= maxAvailableClass) {
                currentClass = nuevoNumero;
                numberDisplay.innerText = currentClass;
                enterBtn.innerText = `INICIAR CLASE ${currentClass}`;
                playDigitalTick();
            }
        }

        // Manejo táctil (Móviles)
        planet.addEventListener('touchstart', (e) => {
            isDragging = true;
            startY = e.touches[0].clientY;
            startX = e.touches[0].clientX;
            accumulatedDelta = 0;
            if (audioCtx.state === 'suspended') audioCtx.resume(); // Desbloquear audio
        });

        planet.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentY = e.touches[0].clientY;
            const currentX = e.touches[0].clientX;
            
            // Calculamos el movimiento (soporta diagonal, pero prioriza el movimiento más largo)
            const deltaY = startY - currentY; 
            const deltaX = currentX - startX; 
            
            // Usamos el delta predominante para scrollear (horizontal o vertical)
            const movement = Math.abs(deltaY) > Math.abs(deltaX) ? deltaY : deltaX;

            accumulatedDelta += movement;

            // Efecto visual de rotación del background de la esfera
            rotationX += deltaX * 0.5;
            planet.style.backgroundPosition = `${rotationX}px ${rotationX * 0.2}px`;

            if (Math.abs(accumulatedDelta) > sensitivity) {
                const steps = Math.floor(Math.abs(accumulatedDelta) / sensitivity);
                const direction = accumulatedDelta > 0 ? 1 : -1; // 1 = arriba/derecha, -1 = abajo/izquierda
                
                let nextNumber = currentClass + (steps * direction);
                
                // Limitar al mínimo 1 y al máximo detectado
                if (nextNumber < 1) nextNumber = 1;
                if (nextNumber > maxAvailableClass) nextNumber = maxAvailableClass;

                updateDisplay(nextNumber);
                
                // Resetear acumulador restando los pasos tomados
                accumulatedDelta = 0; 
            }

            startY = currentY;
            startX = currentX;
        });

        planet.addEventListener('touchend', () => isDragging = false);

        // Manejo con Mouse (Laptops)
        planet.addEventListener('mousedown', (e) => {
            isDragging = true;
            startY = e.clientY;
            startX = e.clientX;
            accumulatedDelta = 0;
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const currentY = e.clientY;
            const currentX = e.clientX;
            
            const deltaY = startY - currentY;
            const deltaX = currentX - startX;
            const movement = Math.abs(deltaY) > Math.abs(deltaX) ? deltaY : deltaX;

            accumulatedDelta += movement;
            rotationX += deltaX * 0.5;
            planet.style.backgroundPosition = `${rotationX}px ${rotationX * 0.2}px`;

            if (Math.abs(accumulatedDelta) > sensitivity) {
                const steps = Math.floor(Math.abs(accumulatedDelta) / sensitivity);
                const direction = accumulatedDelta > 0 ? 1 : -1;
                let nextNumber = currentClass + (steps * direction);
                
                if (nextNumber < 1) nextNumber = 1;
                if (nextNumber > maxAvailableClass) nextNumber = maxAvailableClass;

                updateDisplay(nextNumber);
                accumulatedDelta = 0;
            }

            startY = currentY;
            startX = currentX;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Navegación
        enterBtn.addEventListener('click', () => {
            window.location.href = `class${currentClass}.html`;
        });
        
        // Atajo: Hacer click en la esfera también entra a la clase si no hubo arrastre
        planet.addEventListener('click', (e) => {
            if(Math.abs(accumulatedDelta) < 5) {
                window.location.href = `class${currentClass}.html`;
            }
        });


        // --- LÓGICA DEL FONDO ESPACIAL (Canvas) ---
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            
            // Gradiente espacial
            let gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#05050a');
            gradient.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                // Parallax suave
                star.y -= star.speed;
                // Titileo de estrellas
                star.alpha += (Math.random() - 0.5) * 0.05;
                if(star.alpha < 0.1) star.alpha = 0.1;
                if(star.alpha > 1) star.alpha = 1;

                if (star.y < 0) {
                    star.y = height;
                    star.x = Math.random() * width;
                }
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateStars();

    </script>
</body>
</html>
